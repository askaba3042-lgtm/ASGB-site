<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trésorerie — ASGB</title>
<link id="fav" rel="icon" href="">
<style>
  :root{
    --navy:#12234B; --navy-deep:#0C1832; --navy-soft:#2C3E6B;
    --gold:#C9A24B; --gold-soft:#F4EBD7; --gold-ink:#7A5E1C;
    --rouge:#C31B2B; --jaune:#E9A825; --vert:#1F8A45;
    --ink:#18213A; --body:#4A5670; --soft:#7A849B;
    --line:#E4E9F2; --bg:#FFFFFF; --bg-alt:#F5F7FB;
    --ok-bg:#E7F4EC; --ok-ink:#14532D; --ok-line:#BFE3CC;
    --bad-bg:#FBEAEA; --bad-ink:#8F1620; --bad-line:#F2C4C9;
    --chart-rec:#1F8A45; --chart-dep:#B08427;
    --sans:'Helvetica Neue',Helvetica,'Segoe UI',Arial,sans-serif;
    --shadow:0 10px 30px rgba(18,35,75,.08);
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg-alt);font-size:16px;line-height:1.5}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;touch-action:manipulation}
  input,select,textarea{font:inherit;color:var(--ink)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ---------- Topbar ---------- */
  .topbar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
  .topbar .mark{width:38px;height:38px;flex:none;background:#fff;border-radius:10px;padding:3px}
  .topbar h1{font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.2}
  .topbar h1 span{display:block;font-size:11.5px;font-weight:400;color:#C7D0E4;letter-spacing:.4px}
  .topbar h1{margin-right:auto}
  .sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#E7ECF7;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .sync-pill i{width:8px;height:8px;border-radius:50%;background:#8b93a7;flex:none}
  .sync-pill[data-etat="ok"] i{background:#3FBF6F}
  .sync-pill[data-etat="hors-ligne"] i{background:var(--jaune)}
  @media(max-width:700px){.sync-pill b{display:none}.sync-pill{padding:6px 8px}}
  .balance-pill{background:rgba(255,255,255,.08);border:1px solid rgba(201,162,75,.55);border-radius:999px;padding:7px 16px;text-align:right}
  .balance-pill .l{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#C7D0E4}
  .balance-pill .v{font-size:17px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- Tabs ---------- */
  .tabs{background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 12px;position:sticky;top:62px;z-index:40;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{display:flex;align-items:center;gap:7px;padding:13px 14px 11px;font-size:14.5px;font-weight:600;color:var(--body);border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s}
  .tab svg{width:17px;height:17px;flex:none}
  .tab:hover{color:var(--navy)}
  .tab.active{color:var(--navy);border-bottom-color:var(--gold)}

  /* ---------- Layout ---------- */
  .view{max-width:1220px;margin:0 auto;padding:22px 18px 70px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .card-h h2{font-size:16.5px;font-weight:700}
  .card-h .spacer{flex:1}
  .muted{color:var(--soft);font-size:13.5px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;min-height:42px;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;cursor:pointer}
  .btn svg{width:16px;height:16px;flex:none}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-soft)}
  .btn-gold{background:var(--gold);color:var(--navy-deep)}
  .btn-gold:hover{background:#B8913C}
  .btn-ghost{background:var(--bg);border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--soft);background:var(--bg-alt)}
  .btn-danger{background:var(--rouge);color:#fff}
  .btn-danger:hover{background:#A31221}
  .btn-danger-ghost{background:var(--bg);border-color:var(--bad-line);color:var(--bad-ink)}
  .btn-danger-ghost:hover{background:var(--bad-bg)}
  .btn-sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:8px}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;color:var(--body);border:1px solid transparent}
  .icon-btn:hover{background:var(--bg-alt);color:var(--navy);border-color:var(--line)}
  .icon-btn svg{width:16px;height:16px}

  /* ---------- Year nav ---------- */
  .year-nav{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
  .year-nav .yv{font-weight:700;font-size:15px;padding:0 10px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
  .year-nav button{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--body)}
  .year-nav button:hover{background:var(--bg-alt);color:var(--navy)}
  .year-nav svg{width:16px;height:16px}

  /* ---------- KPI ---------- */
  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:920px){.grid-kpi{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:460px){.grid-kpi{grid-template-columns:1fr}}
  .kpi{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--navy)}
  .kpi.t-gold{border-top-color:var(--gold)}
  .kpi.t-green{border-top-color:var(--vert)}
  .kpi.t-red{border-top-color:var(--rouge)}
  .kpi .k-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--soft);display:flex;align-items:center;gap:6px}
  .kpi .k-label svg{width:14px;height:14px}
  .kpi .k-value{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15}
  .kpi .k-sub{font-size:13px;color:var(--body)}
  .kpi .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .kpi .bar i{display:block;height:100%;background:var(--vert);border-radius:99px}

  /* ---------- Tables ---------- */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);background:var(--bg-alt);font-weight:600;position:sticky;top:0}
  tbody tr:hover{background:#FAFBFE}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tfoot td{background:var(--bg-alt);font-weight:700;border-top:2px solid var(--line);font-variant-numeric:tabular-nums}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid}
  .badge svg{width:11px;height:11px}
  .badge.green{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
  .badge.red{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
  .badge.gray{background:var(--bg-alt);color:var(--body);border-color:var(--line)}
  .badge.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:#E4D2A6}

  /* ---------- Search ---------- */
  .searchbox{position:relative;flex:1;min-width:180px;max-width:320px}
  .searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--soft);pointer-events:none}
  .searchbox input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:42px}
  .searchbox input::placeholder{color:var(--soft)}

  .input,select.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
  textarea.input{min-height:70px;resize:vertical}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:13px;font-weight:600;color:var(--body)}
  .field .hint{font-size:12px;color:var(--soft)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1/-1}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}
  .req{color:var(--rouge)}
  .radio-row{display:flex;gap:10px}
  .radio-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600;cursor:pointer;min-height:44px}
  .radio-pill input{position:absolute;opacity:0}
  .radio-pill.rec:has(input:checked){background:var(--ok-bg);border-color:var(--vert);color:var(--ok-ink)}
  .radio-pill.dep:has(input:checked){background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}

  /* ---------- Cotisations grid ---------- */
  .cot-scroll{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  .cot-table th,.cot-table td{padding:7px 8px;text-align:center}
  .cot-table th:first-child,.cot-table td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:2;border-right:1px solid var(--line);min-width:170px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
  .cot-table thead th{z-index:3}
  .cot-table thead th:first-child{z-index:4;background:var(--bg-alt)}
  .cot-table tbody tr:hover td:first-child{background:#FAFBFE}
  .cot-table tfoot td:first-child{background:var(--bg-alt)}
  .cell{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;transition:transform .1s,border-color .15s}
  .cell svg{width:15px;height:15px}
  .cell:active{transform:scale(.92)}
  .cell.paid{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
  .cell.paid:hover{border-color:var(--vert)}
  .cell.late{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
  .cell.late:hover{border-color:var(--rouge)}
  .cell.due{background:var(--bg);border:1px dashed var(--line);color:var(--soft)}
  .cell.due:hover{border-color:var(--vert);color:var(--vert);border-style:solid}
  .cell-na{color:var(--soft);opacity:.55}
  .cot-name .sub{display:block;font-size:11.5px;color:var(--soft)}
  .th-all{display:flex;align-items:center;justify-content:center;margin:3px auto 0;width:28px;height:22px;border-radius:6px;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
  .th-all:hover{border-color:var(--vert)}
  .th-all svg{width:12px;height:12px}
  .legend-cells{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--body);margin-top:12px}
  .legend-cells span{display:inline-flex;align-items:center;gap:7px}
  .legend-cells .cell{width:24px;height:24px;border-radius:7px;pointer-events:none}
  .legend-cells .cell svg{width:12px;height:12px}

  /* ---------- Chart ---------- */
  .chart-wrap{position:relative}
  .chart-legend{display:flex;gap:18px;align-items:center;font-size:13px;color:var(--body);margin-bottom:6px;flex-wrap:wrap}
  .chart-legend span{display:inline-flex;align-items:center;gap:7px}
  .chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chart-tip{position:absolute;pointer-events:none;background:var(--navy-deep);color:#fff;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(12,24,50,.35);opacity:0;transition:opacity .12s;z-index:5;min-width:150px}
  .chart-tip b{color:var(--gold);display:block;margin-bottom:2px;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .chart-tip .row{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
  .chart-tip .row i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
  .chart-svg text{font-family:var(--sans);fill:var(--soft);font-size:11px}
  .chart-svg .hit{fill:transparent;cursor:pointer}
  .chart-svg .hl{fill:var(--bg-alt);opacity:0;pointer-events:none}
  .chart-svg .hit:hover + .hl,.chart-svg .hit:focus-visible + .hl{opacity:1}

  /* ---------- Late list ---------- */
  .late-item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .late-item:last-child{border-bottom:none}
  .late-item .who{flex:1;min-width:0}
  .late-item .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .late-item .who small{color:var(--soft);font-size:12.5px}
  .late-item .amt{font-weight:700;color:var(--bad-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}}

  /* ---------- Empty state ---------- */
  .empty{text-align:center;padding:38px 20px;color:var(--body)}
  .empty svg{width:38px;height:38px;color:var(--soft);margin-bottom:10px}
  .empty p{margin-bottom:14px}

  /* ---------- Welcome ---------- */
  .welcome{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-soft) 100%);color:#fff;border:none}
  .welcome h2{font-size:19px;margin-bottom:6px}
  .welcome p{color:#C7D0E4;font-size:14.5px;max-width:640px}
  .welcome ol{margin:14px 0 18px 20px;color:#E7ECF7;font-size:14.5px;display:grid;gap:6px}
  .welcome .btn-ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
  .welcome .btn-ghost:hover{background:rgba(255,255,255,.2)}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(12,24,50,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
  .modal{background:var(--bg);border-radius:16px;box-shadow:0 24px 60px rgba(12,24,50,.35);width:100%;max-width:560px;margin:auto 0;animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
  .modal-h h3{font-size:17px;font-weight:700;flex:1}
  .modal-b{padding:16px 20px}
  .modal-f{display:flex;gap:10px;padding:0 20px 20px;flex-wrap:wrap}
  .modal-f .spacer{flex:1}
  .check-list{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
  .check-list label{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .check-list label:last-child{border-bottom:none}
  .check-list label:hover{background:var(--bg-alt)}
  .check-list input{width:17px;height:17px;accent-color:var(--vert)}

  /* ---------- Toast ---------- */
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);background:var(--navy-deep);color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(12,24,50,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 28px)}
  .toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .toast button{color:var(--gold);font-weight:700;text-decoration:underline;white-space:nowrap}

  /* ---------- Rapport ---------- */
  .rapport-sheet{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 38px;max-width:860px;margin:0 auto}
  @media(max-width:640px){.rapport-sheet{padding:22px 18px}}
  .rap-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--gold);padding-bottom:16px;margin-bottom:20px}
  .rap-head .mark{width:52px;height:52px;flex:none}
  .rap-head h2{font-size:19px;color:var(--navy)}
  .rap-head .sub{color:var(--body);font-size:13.5px}
  .rap-sec{margin-bottom:22px}
  .rap-sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--gold-ink);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
  .rap-table td,.rap-table th{padding:7px 10px;font-size:13.5px;white-space:normal}
  .rap-kv{width:100%;font-size:14px}
  .rap-kv td{padding:6px 0;border-bottom:1px dashed var(--line)}
  .rap-kv td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .rap-kv tr.total td{font-weight:700;border-bottom:none;border-top:2px solid var(--navy);color:var(--navy);font-size:15px}
  .signatures{display:flex;gap:40px;margin-top:38px}
  .signatures div{flex:1;text-align:center;font-size:13.5px;color:var(--body)}
  .signatures .line{border-top:1px solid var(--ink);margin-top:52px;padding-top:6px}
  .pill-list{display:flex;flex-wrap:wrap;gap:6px}
  .pill-list .badge{font-weight:500}

  @media print{
    body{background:#fff}
    .topbar,.tabs,.no-print,.toast,.modal-backdrop{display:none!important}
    .view{max-width:none;padding:0}
    .rapport-sheet{border:none;box-shadow:none;border-radius:0;padding:0;max-width:none}
    .rap-sec{break-inside:avoid}
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="mark" id="logoTop" aria-hidden="true"></span>
  <h1>Trésorerie ASGB <span>Alliance Solidarité des Guinéens de Besançon</span></h1>
  <span class="sync-pill" id="syncPill" hidden role="status"><i aria-hidden="true"></i><b>Synchronisé</b></span>
  <div class="balance-pill"><span class="l">Solde de caisse</span><span class="v" id="pillSolde">—</span></div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>

<main class="view" id="view"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<noscript><p style="padding:30px;text-align:center">Cet outil nécessite JavaScript. Merci de l'activer dans votre navigateur.</p></noscript>

<script>
'use strict';
/* =====================================================================
   Trésorerie ASGB — outil autonome du trésorier
   Données stockées localement dans ce navigateur (localStorage).
   Pensez à exporter une sauvegarde JSON régulièrement (onglet Sauvegarde).
   ===================================================================== */

/* ---------- Constantes & helpers ---------- */
const KEY = 'asgb-tresorerie-v1';
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MOIS_AB = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const MODES = ['Espèces','Virement','Chèque','Autre'];
const CAT_REC = ['Don','Événement','Subvention','Collecte solidarité','Autre recette'];
const CAT_DEP = ['Solidarité / entraide','Événement','Fonctionnement','Solidarité internationale','Autre dépense'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const frDate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const norm = s => String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ---------- Store ---------- */
function defaultDb(){
  return {
    version: 1,
    updatedAt: null,
    lastExport: null,
    settings: { cotisationDefaut: 10, soldeInitial: 0, exerciceDebut: CUR_Y + '-01' },
    membres: [],     // {id, nom, prenom, tel, adhesion:'YYYY-MM', statut, cotisation, note, prelevement, autoDepuis}
    paiements: [],   // {id, membreId, annee, mois(0-11), montant, date:'YYYY-MM-DD', mode}
    operations: [],  // {id, date, sens:'recette'|'depense', categorie, libelle, montant, mode, note}
    autoStop: {}     // clés "membreId|annee|mois" : paiement auto supprimé à la main, à ne jamais recréer
  };
}
const MOIS_RE = /^\d{4}-(0[1-9]|1[0-2])$/, DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const idSain = v => String(v ?? '').replace(/[^\w-]/g, '').slice(0, 64);
function normaliser(d){
  // blinde les données quelle que soit leur provenance (ancienne version, import, saisie hors format)
  d.settings = Object.assign({}, defaultDb().settings, (d.settings && typeof d.settings==='object') ? d.settings : {});
  d.settings.cotisationDefaut = num(d.settings.cotisationDefaut);
  d.settings.soldeInitial = num(d.settings.soldeInitial);
  d.membres = (Array.isArray(d.membres) ? d.membres : []).filter(m => m && m.id != null && m.nom != null).map(m => ({
    id: idSain(m.id), nom: String(m.nom), prenom: String(m.prenom || ''), tel: String(m.tel || ''),
    adhesion: MOIS_RE.test(m.adhesion || '') ? m.adhesion : null,
    statut: m.statut === 'inactif' ? 'inactif' : 'actif',
    cotisation: num(m.cotisation), note: String(m.note || ''),
    prelevement: !!m.prelevement,
    autoDepuis: MOIS_RE.test(m.autoDepuis || '') ? m.autoDepuis : null
  }));
  const idsMembres = new Set(d.membres.map(m => m.id));
  d.paiements = (Array.isArray(d.paiements) ? d.paiements : [])
    .filter(p => p && p.id != null && idsMembres.has(idSain(p.membreId)) && isFinite(+p.annee) && +p.mois >= 0 && +p.mois <= 11)
    .map(p => ({ id: idSain(p.id), membreId: idSain(p.membreId), annee: +p.annee, mois: +p.mois,
      montant: num(p.montant), date: DATE_RE.test(p.date || '') ? p.date : todayISO(), mode: String(p.mode || 'Espèces') }));
  d.operations = (Array.isArray(d.operations) ? d.operations : [])
    .filter(o => o && o.id != null && (o.sens === 'recette' || o.sens === 'depense'))
    .map(o => ({ id: idSain(o.id), date: DATE_RE.test(o.date || '') ? o.date : todayISO(), sens: o.sens,
      categorie: String(o.categorie || ''), libelle: String(o.libelle || ''), montant: num(o.montant),
      mode: String(o.mode || ''), note: String(o.note || '') }));
  d.autoStop = (d.autoStop && typeof d.autoStop === 'object' && !Array.isArray(d.autoStop)) ? d.autoStop : {};
  d.rev = Math.max(0, Math.floor(Number(d.rev) || 0));
  return d;
}
let db;
try {
  db = JSON.parse(localStorage.getItem(KEY)) || defaultDb();
  if(!db.membres || !db.settings) db = defaultDb();
  normaliser(db);
} catch(e){ db = defaultDb(); }

function commit(){
  db.rev = (db.rev || 0) + 1;
  db.updatedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert("Impossible d'enregistrer (stockage plein ou bloqué). Exportez une sauvegarde JSON."); }
  syncPushSoon(); // envoi automatique vers la base partagée si la synchronisation est activée
  render();
}

/* ---------- Calculs dérivés ---------- */
const payKey = (mid,a,m) => mid+'|'+a+'|'+m;
function payMap(){ const map=new Map(); for(const p of db.paiements) map.set(payKey(p.membreId,p.annee,p.mois), p); return map; }

function estDu(m, annee, mois){
  if(m.statut !== 'actif') return false;
  if(!m.adhesion) return true;
  const [ay,am] = m.adhesion.split('-').map(Number);
  return (annee*12+mois) >= (ay*12+(am-1));
}
const moisEcoule = (annee,mois) => (annee*12+mois) < (CUR_Y*12+CUR_M); // strictement passé
const moisCourantOuPasse = (annee,mois) => (annee*12+mois) <= (CUR_Y*12+CUR_M);

function soldeTotal(){
  let s = num(db.settings.soldeInitial);
  for(const p of db.paiements) s += p.montant;
  for(const o of db.operations) s += (o.sens==='recette'? o.montant : -o.montant);
  return s;
}

function statsAnnee(Y){
  const pm = payMap();
  let attendus=0, payes=0, mtAttendu=0, mtPaye=0;
  const retards = []; // {membre, moisManquants:[], total}
  // l'argent réellement encaissé reste compté même si le membre est devenu inactif depuis
  for(const p of db.paiements) if(p.annee===Y && moisCourantOuPasse(Y,p.mois)) mtPaye += p.montant;
  for(const m of db.membres){
    let manq=[], tot=0;
    for(let mo=0; mo<12; mo++){
      if(!estDu(m,Y,mo)) continue;
      const p = pm.get(payKey(m.id,Y,mo));
      if(moisCourantOuPasse(Y,mo)){ attendus++; mtAttendu += num(m.cotisation); }
      if(p){ if(moisCourantOuPasse(Y,mo)) payes++; }
      else if(moisEcoule(Y,mo)){ manq.push(mo); tot += num(m.cotisation); }
    }
    if(manq.length) retards.push({membre:m, mois:manq, total:tot});
  }
  retards.sort((a,b)=> b.total-a.total || b.mois.length-a.mois.length);
  return {attendus, payes, mtAttendu, mtPaye, retards};
}

function moisStats(Y,M){
  const pm = payMap();
  let dus=0, payes=0, mt=0; const nonPayes=[];
  for(const p of db.paiements) if(p.annee===Y && p.mois===M) mt += p.montant; // y compris membres devenus inactifs
  for(const m of db.membres){
    if(!estDu(m,Y,M)) continue;
    dus++;
    if(pm.get(payKey(m.id,Y,M))) payes++; else nonPayes.push(m);
  }
  return {dus, payes, mt, nonPayes};
}

function moisImpayes(Y, mois){ // membres actifs dus et non payés pour ce mois
  const pm = payMap();
  return membresTries().filter(m => estDu(m,Y,mois) && !pm.get(payKey(m.id,Y,mois)));
}
function encaisserMois(Y, mois){ // encaisse en un clic tous les impayés du mois (passé, courant ou à venir)
  let list = moisImpayes(Y, mois);
  // respecte le filtre de recherche actif dans la grille : on n'encaisse que ce qui est affiché
  if(ui.tab==='cot' && ui.qCot.trim()){
    const q = norm(ui.qCot);
    list = list.filter(m => norm(nomComplet(m)).includes(q));
  }
  if(!list.length){ toast(`Tout le monde est déjà à jour pour ${MOIS[mois]} ${Y}.`); return; }
  const created = []; let total = 0;
  for(const m of list){
    const rec = {id:uid(), membreId:m.id, annee:Y, mois, montant:num(m.cotisation), date:todayISO(), mode:'Espèces'};
    db.paiements.push(rec); created.push(rec); total += rec.montant;
  }
  commit();
  toast(`${created.length} cotisation${created.length>1?'s':''} encaissée${created.length>1?'s':''} pour ${MOIS[mois]} ${Y} — ${eur(total)}.`, {
    undoLabel:'Annuler',
    undo(){
      const s = new Set(created.map(r=>r.id));
      db.paiements = db.paiements.filter(p=>!s.has(p.id));
      for(const r of created){ // pas de résurrection auto — seulement pour les membres en virement permanent
        const mb = db.membres.find(x=>x.id===r.membreId);
        if(mb && mb.prelevement) db.autoStop[payKey(r.membreId,r.annee,r.mois)] = true;
      }
      commit();
    }
  });
}
function autoManquants(){ // paiements à créer pour les membres en virement permanent
  const pm = payMap(), out = [];
  const cur = CUR_Y*12 + CUR_M;
  for(const m of db.membres){
    if(m.statut!=='actif' || !m.prelevement || !m.autoDepuis) continue;
    const [dy,dm] = m.autoDepuis.split('-').map(Number);
    let start = dy*12 + (dm-1);
    if(m.adhesion){ const [ay,am] = m.adhesion.split('-').map(Number); start = Math.max(start, ay*12+(am-1)); }
    for(let idx=start; idx<=cur; idx++){
      const Y = Math.floor(idx/12), mo = idx%12;
      if(pm.get(payKey(m.id,Y,mo))) continue;
      if(db.autoStop[payKey(m.id,Y,mo)]) continue; // supprimé à la main : on ne recrée pas
      out.push({id:uid(), membreId:m.id, annee:Y, mois:mo, montant:num(m.cotisation),
        date: idx===cur ? todayISO() : Y+'-'+String(mo+1).padStart(2,'0')+'-01', mode:'Virement'});
    }
  }
  return out;
}
function autoEncaisse(){ // enregistre les cotisations automatiques manquantes ; retourne les paiements créés
  const list = autoManquants();
  if(list.length) db.paiements.push(...list);
  return list;
}
function undoAuto(list){ // annule des paiements automatiques sans qu'ils soient recréés
  const s = new Set(list.map(r=>r.id));
  db.paiements = db.paiements.filter(p=>!s.has(p.id));
  for(const r of list) db.autoStop[payKey(r.membreId,r.annee,r.mois)] = true;
  commit();
}

function seriesAnnee(Y){ // vue "caisse" : par date d'encaissement
  const cot=Array(12).fill(0), rec=Array(12).fill(0), dep=Array(12).fill(0);
  const pref = Y+'-';
  for(const p of db.paiements) if(p.date && p.date.startsWith(pref)) cot[+p.date.slice(5,7)-1] += p.montant;
  for(const o of db.operations) if(o.date && o.date.startsWith(pref)){
    const mo = +o.date.slice(5,7)-1;
    if(o.sens==='recette') rec[mo]+=o.montant; else dep[mo]+=o.montant;
  }
  return {cot, rec, dep};
}

function fluxAvant(iso){ // solde à la veille de `iso` (YYYY-MM-DD)
  let s = num(db.settings.soldeInitial);
  for(const p of db.paiements) if(p.date && p.date < iso) s += p.montant;
  for(const o of db.operations) if(o.date && o.date < iso) s += (o.sens==='recette'? o.montant : -o.montant);
  return s;
}

const membresTries = () => [...db.membres].sort((a,b)=> norm(a.nom+a.prenom).localeCompare(norm(b.nom+b.prenom)));

/* ---- Graphique barres groupées (SVG) ---- */
function niceCeil(v){
  if(v<=0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p >= v) return m*p;
  return 10*p;
}
function chartHtml(Y,s){
  const W=760,H=270, padL=54,padR=8,padT=12,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const recT = s.cot.map((v,i)=>v+s.rec[i]);
  const max = niceCeil(Math.max(...recT, ...s.dep, 1));
  const y = v => padT + plotH*(1-v/max);
  const mw = plotW/12;
  const bw = Math.min(15, (mw-16)/2);
  const fmtAx = v => v>=1000 ? (v/1000).toLocaleString('fr-FR')+' k€' : v+' €';

  let grid='', bars='', hits='', labels='';
  for(let g=0; g<=4; g++){
    const val = max*g/4, gy = y(val);
    grid += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>
             <text x="${padL-8}" y="${gy+4}" text-anchor="end">${fmtAx(val)}</text>`;
  }
  const barPath = (x,v,w) => {
    if(v<=0) return '';
    const top=y(v), h=padT+plotH-top, r=Math.min(4,h,w/2);
    return `M${x},${padT+plotH} L${x},${top+r} Q${x},${top} ${x+r},${top} L${x+w-r},${top} Q${x+w},${top} ${x+w},${top+r} L${x+w},${padT+plotH} Z`;
  };
  for(let i=0;i<12;i++){
    const cx = padL + mw*i + mw/2;
    const x1 = cx - bw - 1, x2 = cx + 1;
    bars += `<path d="${barPath(x1,recT[i],bw)}" fill="var(--chart-rec)"/>`;
    bars += `<path d="${barPath(x2,s.dep[i],bw)}" fill="var(--chart-dep)"/>`;
    labels += `<text x="${cx}" y="${H-8}" text-anchor="middle">${MOIS_AB[i]}</text>`;
    const lbl = `${MOIS[i]} ${Y} — recettes ${eur(recT[i])}, dépenses ${eur(s.dep[i])}`;
    hits += `<rect class="hit" x="${padL+mw*i}" y="${padT}" width="${mw}" height="${plotH}" tabindex="0" role="img" aria-label="${esc(lbl)}" data-chart-m="${i}"/>
             <rect class="hl" x="${padL+mw*i+1}" y="${padT}" width="${mw-2}" height="${plotH}" rx="6"/>`;
  }
  return `
    <div class="chart-legend">
      <span><i style="background:var(--chart-rec)"></i>Recettes (cotisations + autres)</span>
      <span><i style="background:var(--chart-dep)"></i>Dépenses</span>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Recettes et dépenses par mois, ${Y}">
        ${grid}
        <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--soft)" stroke-width="1"/>
        ${bars}${labels}
        <g>${hits}</g>
      </svg>
      <div class="chart-tip" id="chartTip"></div>
    </div>`;
}
function chartTableHtml(Y,s){
  let rows='';
  for(let i=0;i<12;i++){
    const rt = s.cot[i]+s.rec[i];
    if(!rt && !s.dep[i]) continue;
    const res = Math.round((rt - s.dep[i]) * 100) / 100;
    rows += `<tr><td>${MOIS[i]}</td><td class="num">${eur(s.cot[i])}</td><td class="num">${eur(s.rec[i])}</td><td class="num">${eur(s.dep[i])}</td><td class="num" style="font-weight:600;color:${res>=0?'var(--ok-ink)':'var(--bad-ink)'}">${eur(res)}</td></tr>`;
  }
  const tc=s.cot.reduce((a,b)=>a+b,0), tr=s.rec.reduce((a,b)=>a+b,0), td=s.dep.reduce((a,b)=>a+b,0);
  return `<div class="table-scroll"><table>
    <thead><tr><th scope="col">Mois</th><th class="num" scope="col">Cotisations</th><th class="num" scope="col">Autres recettes</th><th class="num" scope="col">Dépenses</th><th class="num" scope="col">Résultat</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Total ${Y}</td><td class="num">${eur(tc)}</td><td class="num">${eur(tr)}</td><td class="num">${eur(td)}</td><td class="num">${eur(tc+tr-td)}</td></tr></tfoot>
  </table></div>`;
}
function bindDash(){
  const wrap = document.getElementById('chartWrap');
  if(!wrap) return;
  const tip = document.getElementById('chartTip');
  const s = seriesAnnee(ui.annee);
  const show = (el)=>{
    const i = +el.dataset.chartM;
    const rt = s.cot[i]+s.rec[i];
    tip.innerHTML = `<b>${MOIS[i]} ${ui.annee}</b>
      <div class="row"><span><i style="background:var(--chart-rec)"></i>Cotisations</span><span>${eur(s.cot[i])}</span></div>
      <div class="row"><span><i style="background:var(--chart-rec);opacity:.55"></i>Autres recettes</span><span>${eur(s.rec[i])}</span></div>
      <div class="row"><span><i style="background:var(--chart-dep)"></i>Dépenses</span><span>${eur(s.dep[i])}</span></div>
      <div class="row" style="border-top:1px solid rgba(255,255,255,.25);margin-top:4px;padding-top:4px"><span>Résultat</span><span>${eur(rt-s.dep[i])}</span></div>`;
    const wr = wrap.getBoundingClientRect(), er = el.getBoundingClientRect();
    let x = er.left - wr.left + er.width/2 - 80;
    x = Math.max(4, Math.min(x, wr.width-170));
    tip.style.left = x+'px';
    tip.style.top = Math.max(0, er.top-wr.top-8)+'px';
    tip.style.opacity = 1;
  };
  const hide = ()=> tip.style.opacity = 0;
  wrap.querySelectorAll('.hit').forEach(el=>{
    el.addEventListener('mouseenter',()=>show(el));
    el.addEventListener('mouseleave',hide);
    el.addEventListener('focus',()=>show(el));
    el.addEventListener('blur',hide);
  });
}

function vCot(){
  const Y = ui.annee;
  const pm = payMap();
  const q = norm(ui.qCot);
  const list = membresTries().filter(m=> !q || norm(nomComplet(m)).includes(q));

  if(!db.membres.length){
    return `<section class="card"><div class="empty">${icon('users')}<p>Ajoutez d'abord des membres pour pointer leurs cotisations.</p>
      <button class="btn btn-gold" data-act="member-new">${icon('plus')} Ajouter un membre</button></div></section>`;
  }

  const totMois = Array(12).fill(0);
  const rows = list.map(m=>{
    let paye=0, du=0, cells='';
    for(let mo=0; mo<12; mo++){
      const due = estDu(m,Y,mo);
      const p = pm.get(payKey(m.id,Y,mo));
      if(p) totMois[mo]+=p.montant;
      if(!due && !p){ cells += `<td><span class="cell-na" title="${MOIS[mo]} : non concerné (avant l'adhésion ou membre inactif)">–</span></td>`; continue; }
      if(due && moisCourantOuPasse(Y,mo)) du++;
      if(p){
        paye++;
        cells += `<td><button class="cell paid" data-act="cell" data-id="${m.id}" data-mois="${mo}" title="Payé le ${frDate(p.date)} · ${esc(p.mode)} · ${eur(p.montant)}" aria-label="${MOIS[mo]} : payé le ${frDate(p.date)}, ${eur(p.montant)}. Modifier">${icon('check')}</button></td>`;
      } else if(due && moisEcoule(Y,mo)){
        cells += `<td><button class="cell late" data-act="cell" data-id="${m.id}" data-mois="${mo}" title="${MOIS[mo]} : en retard" aria-label="${MOIS[mo]} : impayé, en retard. Enregistrer un paiement">${icon('x')}</button></td>`;
      } else {
        cells += `<td><button class="cell due" data-act="cell" data-id="${m.id}" data-mois="${mo}" title="${MOIS[mo]} : à encaisser" aria-label="${MOIS[mo]} : non payé. Enregistrer un paiement">${icon('plus')}</button></td>`;
      }
    }
    return `<tr>
      <td class="cot-name"><strong>${esc(nomComplet(m))}</strong><span class="sub">${m.statut==='inactif'?'Inactif · ':''}${m.prelevement?'Virement auto · ':''}${eur(m.cotisation)}/mois${m.adhesion? ' · depuis '+MOIS_AB[+m.adhesion.slice(5,7)-1].toLowerCase()+' '+m.adhesion.slice(0,4) : ''}</span></td>
      ${cells}
      <td class="num" style="font-weight:600">${paye}${du?'/'+du:''}</td>
    </tr>`;
  }).join('');

  const ms = moisStats(Y, (Y===CUR_Y)?CUR_M:11);
  // boutons "tout encaisser" : tous les mois de l'année (janvier à décembre), uniquement sur les membres affichés
  const impMois = MOIS.map((_,i)=> list.filter(m=> estDu(m,Y,i) && !pm.get(payKey(m.id,Y,i))).length);

  return `
    <div class="toolbar">
      ${yearNav('year')}
      <div class="searchbox">${icon('search')}<input type="search" placeholder="Filtrer les membres…" value="${esc(ui.qCot)}" data-input="qCot" aria-label="Filtrer les membres"></div>
      <span class="spacer" style="flex:1"></span>
      <button class="btn btn-primary" data-act="pointage">${icon('checkAll')} Pointage rapide</button>
    </div>
    <section class="card" style="padding:0;overflow:hidden">
      <div class="cot-scroll">
        <table class="cot-table">
          <thead><tr><th scope="col">Membre</th>${MOIS_AB.map((mm,i)=>`<th scope="col" ${Y===CUR_Y&&i===CUR_M?'style="color:var(--gold-ink)"':''}>${mm}${impMois[i]? (lbl => `<button class="th-all" data-act="mois-all" data-annee="${Y}" data-mois="${i}" title="${lbl}" aria-label="${lbl}">${icon('checkAll')}</button>`)(impMois[i]>1? `Encaisser les ${impMois[i]} cotisations restantes ${deMois(i)} en un clic` : `Encaisser la cotisation restante ${deMois(i)} en un clic`):''}</th>`).join('')}<th class="num" scope="col">Payés</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="14" style="text-align:center;color:var(--soft);padding:20px">Aucun membre ne correspond au filtre.</td></tr>`}</tbody>
          <tfoot><tr><td>Encaissé</td>${totMois.map(t=>`<td style="font-size:12px">${t? eur(t).replace(/,00\s?€/,' €') : '·'}</td>`).join('')}<td class="num">${eur(totMois.reduce((a,b)=>a+b,0))}</td></tr></tfoot>
        </table>
      </div>
    </section>
    <div class="legend-cells" aria-hidden="true">
      <span><span class="cell paid">${icon('check')}</span> Payé</span>
      <span><span class="cell late">${icon('x')}</span> En retard</span>
      <span><span class="cell due">${icon('plus')}</span> À encaisser</span>
      <span><span class="cell-na">–</span> Non concerné (avant adhésion / inactif)</span>

}

/* ===================== Rapport AG ===================== */
function vRapport(){
  const Y = ui.rapAnnee, M = ui.rapMois;
  const first = `${Y}-${String(M+1).padStart(2,'0')}-01`;
  const nextIso = M===11 ? `${Y+1}-01-01` : `${Y}-${String(M+2).padStart(2,'0')}-01`;

  const soldeDebut = fluxAvant(first);
  const paysMois = db.paiements.filter(p=>p.date>=first && p.date<nextIso).sort((a,b)=>a.date.localeCompare(b.date));
  const opsMois  = db.operations.filter(o=>o.date>=first && o.date<nextIso).sort((a,b)=>a.date.localeCompare(b.date));
  const totCot = paysMois.reduce((s,p)=>s+p.montant,0);
  const totRec = opsMois.filter(o=>o.sens==='recette').reduce((s,o)=>s+o.montant,0);
  const totDep = opsMois.filter(o=>o.sens==='depense').reduce((s,o)=>s+o.montant,0);
  const soldeFin = soldeDebut + totCot + totRec - totDep;

  const ms = moisStats(Y,M);
  const mById = new Map(db.membres.map(m=>[m.id,m]));

  const opRows = [

function rangeAnnees(){
  let min = CUR_Y, max = CUR_Y;
  const vu = y => { if(isFinite(y) && y >= 2000 && y <= 2100){ if(y < min) min = y; if(y > max) max = y; } };
  for(const p of db.paiements) vu(p.annee);
  for(const o of db.operations) if(o.date) vu(+o.date.slice(0,4));
  min = Math.min(min, 2023);
  const out=[]; for(let y = Math.min(max+1, 2100); y >= min; y--) out.push(y);
  return out;
}

const modalRoot = document.getElementById('modalRoot');
function openModal(html, onMount){
  modalRoot.innerHTML = `<div class="modal-backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const bd = modalRoot.firstElementChild;
  bd.addEventListener('mousedown', e=>{ if(e.target===bd) closeModal(); });
  const f = bd.querySelector('.modal-b input:not([type=checkbox]), .modal-b select, .modal-b textarea') || bd.querySelector('.modal-f button');
  if(f) f.focus();
  if(onMount) onMount(bd);
}
function closeModal(){ modalRoot.innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

const modalHead = (title) => `<div class="modal-h"><h3>${title}</h3><button class="icon-btn" data-close-btn aria-label="Fermer">${icon('x')}</button></div>`;

function confirmDlg({title='Confirmer', message, okLabel='Confirmer', onOk}){
  openModal(`${modalHead(esc(title))}
    <div class="modal-b"><p style="font-size:14.5px">${message}</p></div>
    <div class="modal-f"><span class="spacer"></span>
      <button class="btn btn-ghost" data-close-btn>Annuler</button>
      <button class="btn btn-danger" id="cfOk">${esc(okLabel)}</button>
    </div>`,
    bd=>{ bd.querySelector('#cfOk').addEventListener('click', ()=>{ closeModal(); onOk(); }); });
}

/* ---- Cellule cotisation ---- */
function cellAction(id, mois){
  const m = db.membres.find(x=>x.id===id); if(!m) return;
  const Y = ui.annee;
  const p = payMap().get(payKey(id,Y,mois));
  if(!p){
    const rec = {id:uid(), membreId:id, annee:Y, mois, montant:num(m.cotisation), date:todayISO(), mode:'Espèces'};
    db.paiements.push(rec);
    commit();
    toast(`${nomComplet(m)} — ${MOIS[mois]} ${Y} : ${eur(rec.montant)} encaissés.`, {
      undoLabel:'Annuler',
      undo(){ db.paiements = db.paiements.filter(x=>x.id!==rec.id); commit(); }
    });
  } else {
    paymentModal(p, m);
  }
}
function paymentModal(p, m){
  openModal(`${modalHead('Paiement — '+esc(nomComplet(m)))}
    <form id="fPay">
    <div class="modal-b">
      <p class="muted" style="margin-bottom:12px">Cotisation de <strong>${MOIS[p.mois]} ${p.annee}</strong></p>

        <div class="field"><label for="pMode">Mode de paiement</label>
          <select class="input" id="pMode">${MODES.map(x=>`<option ${x===p.mode?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label for="pMt">Montant (€)</label><input class="input" id="pMt" type="number" step="0.01" min="0" required value="${p.montant}"></div>
      </div>
    </div>
    <div class="modal-f">
      <button type="button" class="btn btn-danger-ghost" id="pDel">${icon('trash')} Annuler ce paiement</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" data-close-btn>Fermer</button>
      <button type="submit" class="btn btn-primary">${icon('check')} Enregistrer</button>
    </div>
    </form>`,
    bd=>{
      bd.querySelector('#fPay').addEventListener('submit', e=>{
        e.preventDefault();
        const mt = num(bd.querySelector('#pMt').value);
        if(mt <= 0){ toast('Montant invalide : le paiement n’a pas été modifié.'); return; }

        closeModal(); commit();

      });
    });

/* ===================== Toast ===================== */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg, opts={}){
  clearTimeout(toastTimer);
  toastEl.innerHTML = `<span>${esc(msg)}</span>${opts.undo? `<button id="toastUndo">${esc(opts.undoLabel||'Annuler')}</button>`:''}`;
  if(opts.undo) toastEl.querySelector('#toastUndo').addEventListener('click', ()=>{ hideToast(); opts.undo(); });
  toastEl.classList.add('show');
  toastTimer = setTimeout(hideToast, opts.undo? 7000 : 4000);
}
function hideToast(){ toastEl.classList.remove('show'); }

/* ===================== Import / export ===================== */
function download(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
const csvJoin = rows => '﻿' + rows.map(r => r.map(v=>{
  v = String(v ?? '');
  if(/^[=+@\t\r]/.test(v)) v = "'" + v; // empêche Excel d'interpréter la cellule comme une formule
  return /[";\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}).join(';')).join('\r\n');
const csvNum = n => String(Math.round((Number(n)||0)*100)/100).replace('.',',');

function exportJson(){
  db.lastExport = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ /* stockage plein : le téléchargement doit quand même partir */ }
  download('asgb-tresorerie-'+todayISO()+'.json', JSON.stringify(db, null, 2), 'application/json');
  toast('Sauvegarde exportée. Conservez ce fichier en lieu sûr.');
  render();
}
function importJson(file){
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); } catch(e){ toast('Fichier illisible : ce n’est pas une sauvegarde valide.'); return; }
    if(!data || !Array.isArray(data.membres) || !Array.isArray(data.paiements) || !data.settings){
      toast('Ce fichier ne ressemble pas à une sauvegarde de trésorerie ASGB.'); return;
    }
    confirmDlg({
      title:'Restaurer cette sauvegarde ?',
      message:`Elle contient <strong>${data.membres.length} membres</strong>, <strong>${data.paiements.length} paiements</strong> et <strong>${(data.operations||[]).length} opérations</strong>.<br><br>Les données actuelles de ce navigateur (${db.membres.length} membres, ${db.paiements.length} paiements) seront <strong>remplacées</strong>.`,
      okLabel:'Remplacer les données',
      onOk(){
        hideToast();
        db = normaliser(data);
        const crees = autoEncaisse(); // rattrape les virements permanents depuis la date de la sauvegarde
        commit();
        toast('Sauvegarde restaurée.' + (crees.length? ` ${crees.length} cotisation${crees.length>1?'s':''} automatique${crees.length>1?'s':''} ajoutée${crees.length>1?'s':''} (virement permanent).` : ''),
          crees.length? {undoLabel:'Annuler les automatiques', undo(){ undoAuto(crees); }} : undefined);
      }
    });
  };
  rd.readAsText(file);
}
function csvMembres(){
  const rows = [['Nom','Prénom','Téléphone','Membre depuis','Statut','Cotisation mensuelle','Note']];
  for(const m of membresTries()) rows.push([m.nom, m.prenom, m.tel, m.adhesion, m.statut, csvNum(m.cotisation), m.note]);
  download('asgb-membres-'+todayISO()+'.csv', csvJoin(rows), 'text/csv;charset=utf-8');
}
function csvCot(){
  const Y = ui.annee, pm = payMap();
  const rows = [['Membre', ...MOIS, 'Total payé '+Y]];
  for(const m of membresTries()){
    let tot=0; const r=[nomComplet(m)];
    for(let mo=0;mo<12;mo++){
      const p = pm.get(payKey(m.id,Y,mo));
      if(p){ r.push(csvNum(p.montant)); tot+=p.montant; }
      else r.push(estDu(m,Y,mo)? (moisEcoule(Y,mo)?'RETARD':'') : '-');
    }
    r.push(csvNum(tot)); rows.push(r);
  }
  download('asgb-cotisations-'+Y+'.csv', csvJoin(rows), 'text/csv;charset=utf-8');
}
function csvJournal(){
  const mById = new Map(db.membres.map(m=>[m.id,m]));
  const rows = [['Date','Type','Catégorie','Libellé','Mode','Montant','Note']];
  const all = [
    ...db.paiements.map(p=>({date:p.date, t:'Recette', c:'Cotisation', l:'Cotisation '+MOIS[p.mois]+' '+p.annee+' — '+nomComplet(mById.get(p.membreId)||{nom:'?'}), mo:p.mode, mt:p.montant, n:''})),
    ...db.operations.map(o=>({date:o.date, t:o.sens==='recette'?'Recette':'Dépense', c:o.categorie, l:o.libelle, mo:o.mode, mt:o.sens==='recette'?o.montant:-o.montant, n:o.note}))
  ].sort((a,b)=> String(a.date).localeCompare(String(b.date)));
  for(const r of all) rows.push([r.date, r.t, r.c, r.l, r.mo, csvNum(r.mt), r.n]);
  download('asgb-journal-'+todayISO()+'.csv', csvJoin(rows), 'text/csv;charset=utf-8');
}

/* ===================== Synchronisation en ligne (partage bureau) ===================== */
const SYNC_KEY = 'asgb-tresorerie-sync';
const sync = { cfg: null, es: null, etat: 'off', pushTimer: null, lastPushedRev: 0 };
try { sync.cfg = JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch(e){ sync.cfg = null; }

const syncActif = () => !!(sync.cfg && sync.cfg.actif && sync.cfg.url && sync.cfg.code);
const syncEndpoint = () => sync.cfg.url.replace(/\/+$/,'') + '/asgb/' + encodeURIComponent(sync.cfg.code) + '.json';
function syncSaveCfg(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync.cfg)); } catch(e){} }

function setSyncEtat(etat){
  const avant = sync.etat;
  sync.etat = etat;
  const pill = document.getElementById('syncPill');
  if(pill){
    pill.hidden = (etat === 'off');
    pill.dataset.etat = etat;
    const b = pill.querySelector('b');
    if(b) b.textContent = (etat === 'ok') ? 'Synchronisé' : 'Hors ligne';
    pill.title = (etat === 'ok') ? 'Connecté à la base partagée : les modifications circulent automatiquement.'
               : (etat === 'hors-ligne') ? 'Base partagée injoignable — vos saisies restent enregistrées sur cet appareil et repartiront à la reconnexion.' : '';
  }
  if(avant !== etat && ui.tab === 'save') render();
}

function syncPushSoon(){
  if(!syncActif()) return;
  clearTimeout(sync.pushTimer);
  sync.pushTimer = setTimeout(syncPushNow, 600);
}
function syncPushNow(){
  if(!syncActif()) return;
  const rev = db.rev || 0;
  fetch(syncEndpoint(), { method:'PUT', body: JSON.stringify(db) })
    .then(r => { if(!r.ok) throw new Error(r.status); sync.lastPushedRev = rev; setSyncEtat('ok'); })
    .catch(() => setSyncEtat('hors-ligne'));
}
function syncApplyRemote(data){
  if(data == null){ syncPushNow(); return; } // base en ligne encore vide : on y dépose nos données
  if(data.updatedAt && data.updatedAt === db.updatedAt){ setSyncEtat('ok'); return; } // écho de notre propre envoi
  const rDist = Math.floor(Number(data.rev) || 0), rLoc = db.rev || 0;
  const distantGagne = rDist > rLoc || (rDist === rLoc && String(data.updatedAt || '') > String(db.updatedAt || ''));
  if(distantGagne){
    db = normaliser(data);
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){}
    render();
    setSyncEtat('ok');
  } else {
    syncPushSoon(); // notre version est plus récente : on la renvoie
  }
}
function syncStop(){
  if(sync.es){ sync.es.close(); sync.es = null; }
  clearTimeout(sync.pushTimer);
  setSyncEtat('off');
}
function syncStart(){
  syncStop();
  if(!syncActif()) return;
  setSyncEtat('hors-ligne');
  const refetch = () => fetch(syncEndpoint()).then(r=>r.json()).then(syncApplyRemote).catch(()=> setSyncEtat('hors-ligne'));
  refetch();
  try {
    const es = new EventSource(syncEndpoint());
    sync.es = es;
    es.addEventListener('put', ev => {
      try { const m = JSON.parse(ev.data); (m && m.path === '/') ? syncApplyRemote(m.data) : refetch(); } catch(e){}
    });
    es.addEventListener('patch', refetch);
    es.onopen = () => { setSyncEtat('ok'); if((db.rev || 0) > sync.lastPushedRev) syncPushSoon(); };
    es.onerror = () => setSyncEtat('hors-ligne'); // EventSource retente tout seul
  } catch(e){ setSyncEtat('hors-ligne'); }
}
window.addEventListener('online', () => { if(syncActif()) syncPushSoon(); });

document.addEventListener('click', e=>{
  const copie = e.target.closest('[data-copie]');
  if(copie){
    const ta = document.querySelector(copie.dataset.copie);
    if(ta){
      const fini = ok => toast(ok ? 'Copié dans le presse-papiers.' : 'Sélectionnez le texte puis Ctrl/Cmd+C.');
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(()=>fini(true), ()=>{ ta.focus(); ta.select(); fini(false); }); }
      else { ta.focus(); ta.select(); try { fini(document.execCommand('copy')); } catch(err){ fini(false); } }
    }
    return;
  }
  const closeBtn = e.target.closest('[data-close-btn]');
  if(closeBtn){ closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'tab': ui.tab = el.dataset.tab; render(); window.scrollTo({top:0}); break;
    case 'year': ui.annee = Math.max(2020, Math.min(2100, ui.annee + Number(el.dataset.d))); render(); break;
    case 'member-new': memberModal(null); break;
    case 'member-edit': memberModal(el.dataset.id); break;
    case 'cell': cellAction(el.dataset.id, +el.dataset.mois); break;
    case 'mois-all': encaisserMois(+el.dataset.annee, +el.dataset.mois); break;
    case 'pointage': pointageModal(); break;
    case 'op-new': opModal(null); break;
    case 'op-edit': opModal(el.dataset.id); break;
    case 'op-del': {
      const o = db.operations.find(x=>x.id===el.dataset.id);
      if(o) confirmDlg({title:'Supprimer cette opération ?', message:`<strong>${esc(o.libelle)}</strong> (${frDate(o.date)}, ${eur(o.montant)}) sera supprimée du journal.`, okLabel:'Supprimer',
        onOk(){ db.operations = db.operations.filter(x=>x.id!==o.id); commit(); toast('Opération supprimée.'); }});
      break;
    }
    case 'goto-cot': ui.tab='cot'; ui.qCot = el.dataset.q||''; render(); window.scrollTo({top:0}); break;
    case 'chart-toggle': ui.chartTable = !ui.chartTable; render(); break;
    case 'print': window.print(); break;
    case 'export-json': exportJson(); break;
    case 'import-json': document.getElementById('importFile').click(); break;
    case 'csv-membres': csvMembres(); break;
    case 'csv-cot': csvCot(); break;
    case 'csv-journal': csvJournal(); break;
    case 'sync-generer': {
      const inp = document.getElementById('syncCode');
      if(inp) inp.value = (uid()+uid()).replace(/[^a-z0-9]/gi,'').slice(0,32);
      break;
    }
    case 'sync-guide': syncGuideModal(); break;
    case 'sync-activer': {
      const url = ((document.getElementById('syncUrl')||{}).value||'').trim();
      const code = ((document.getElementById('syncCode')||{}).value||'').trim();
      if(!/^https:\/\/[\w.-]+/.test(url)){ toast('Adresse invalide — elle doit commencer par https:// (voir le guide).'); break; }
      if(code.length < 12 || /[^\w-]/.test(code)){ toast('Code d’équipe invalide — utilisez le bouton « Générer ».'); break; }
      sync.cfg = { url, code, actif: true };
      syncSaveCfg(); syncStart(); render();
      toast('Synchronisation activée : vos données vont être partagées automatiquement.');
      break;
    }
    case 'sync-invitation': syncInvitationModal(); break;
    case 'sync-desactiver':
      confirmDlg({
        title: 'Désactiver la synchronisation ?',
        message: 'Cet appareil cessera d’envoyer et de recevoir les modifications. Les données restent enregistrées ici, et la base en ligne n’est pas effacée.',
        okLabel: 'Désactiver',
        onOk(){ if(sync.cfg) sync.cfg.actif = false; syncSaveCfg(); syncStop(); render(); toast('Synchronisation désactivée.'); }
      });
      break;
    case 'reset-all':
      confirmDlg({
        title:'Tout effacer ?',
        message:`<strong>Toutes les données</strong> (${db.membres.length} membres, ${db.paiements.length} paiements, ${db.operations.length} opérations) seront supprimées définitivement de ce navigateur.<br><br>Exportez d'abord une sauvegarde JSON si vous voulez pouvoir revenir en arrière.`,
        okLabel:'Tout effacer définitivement',
        onOk(){ hideToast(); db = defaultDb(); commit(); toast('Données effacées.'); }
      });
      break;
  }
});

  if(e.key !== KEY || e.newValue == null) return;
  try { db = normaliser(JSON.parse(e.newValue)); } catch(err){ return; }
  render();
});
document.addEventListener('visibilitychange', ()=>{
  // page laissée ouverte au-delà d'un changement de mois : on recharge pour recalculer dus/retards/auto
  if(document.visibilityState !== 'visible') return;
  const n = new Date();
  if((n.getFullYear() !== CUR_Y || n.getMonth() !== CUR_M) && !document.querySelector('.modal-backdrop')) location.reload();
});

/* ---------- Init ---------- */
document.getElementById('logoTop').innerHTML = LOGO;
document.getElementById('fav').href = 'data:image/svg+xml;utf8,' + encodeURIComponent(LOGO);
const autoCrees = autoEncaisse();
if(autoCrees.length){
  commit();
  toast(`${autoCrees.length} cotisation${autoCrees.length>1?'s':''} enregistrée${autoCrees.length>1?'s':''} automatiquement (virement permanent).`,
    {undoLabel:'Annuler', undo(){ undoAuto(autoCrees); }});
} else {
  render();
}
syncStart(); // reprend la synchronisation partagée si elle a été activée sur cet appareil
</script>
